
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Peminjaman Ruang Kampus</title>
</head>
<body>

    <h1>Sistem Peminjaman Ruang Kampus</h1>
    <p>Selamat datang di aplikasi peminjaman ruang kampus.</p>

    <h2>Menu</h2>
    <ul>
        <li>Daftar Ruang</li>
        <li>Pengajuan Peminjaman</li>
        <li>Status Pengajuan</li>
    </ul>

    <hr>

    <h2>Formulir Peminjaman Ruang</h2>

    <form>
        <label>Nama Peminjam:</label><br>
        <input type="text" name="nama" required><br><br>

        <label>NIM:</label><br>
        <input type="text" name="nim" required><br><br>

        <label>Pilih Ruangan:</label><br>
        <select name="ruangan" required>
            <option value="">-- Pilih Ruangan --</option>
            <option value="101">Ruang 101</option>
            <option value="102">Ruang 102</option>
            <option value="103">Ruang 103</option>
        </select><br><br>

        <label>Tanggal Peminjaman:</label><br>
        <input type="date" name="tanggal" required><br><br>

        <label>Keperluan:</label><br>
        <textarea name="keperluan" required></textarea><br><br>

        <button type="submit">Ajukan Peminjaman</button>
    </form>

</body>
</html>
